services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voltron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltron}
      POSTGRES_DB: voltron
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltron -d voltron"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://voltron:${POSTGRES_PASSWORD:-voltron}@postgres:5432/voltron
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
